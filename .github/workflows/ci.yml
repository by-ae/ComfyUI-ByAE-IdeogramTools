name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=__pycache__,.git
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=__pycache__,.git
    
    - name: Check Python syntax
      run: |
        python -m py_compile __init__.py
        python -m py_compile nodes/__init__.py
        python -m py_compile nodes/ideogram4_nodes.py
        python -m py_compile routes.py
        python -m py_compile store.py
    
    - name: Run unit tests
      run: |
        python -m unittest discover -s tests -p 'test_*.py' -v
  
  javascript-check:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Check JavaScript syntax
      run: |
        node -c web/js/ideogram4_prompt_builder_enhanced.js
        node -c web/js/ideogram4_shared.js
        node -c web/js/utility.js
